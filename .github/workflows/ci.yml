name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ruby ${{ matrix.ruby }} / ${{ matrix.db }} / ar ${{ matrix.ar }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4", "4.0"]
        db: [sqlite, postgres, mysql]
        # The full adapter surface runs against the newest supported
        # ActiveRecord; the older pinned versions cover version compatibility
        # on SQLite.
        ar: ["8.1", "7.1", "8.0"]
        exclude:
          - ar: "7.1"
            db: postgres
          - ar: "7.1"
            db: mysql
          - ar: "8.0"
            db: postgres
          - ar: "8.0"
            db: mysql

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB: ${{ matrix.db }}
      BUNDLE_GEMFILE: ${{ format('gemfiles/activerecord-{0}.gemfile', matrix.ar) }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec
